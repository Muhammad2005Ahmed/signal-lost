<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070D" />
    <meta name="description" content="SIGNAL LOST - an interactive 3D portfolio by Muhammad Ahmed. Restore power to the station." />
    <title>SIGNAL LOST | Muhammad Ahmed</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%2300E5FF' stroke-width='3'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- 3D canvas -->
    <canvas id="scene" aria-label="3D space station scene"></canvas>

    <!-- UI mount points (filled by src/ui/* modules) -->
    <header id="hud" hidden>
      <span class="hud__label">LOCATION</span>
      <span id="hud-room" class="hud__value">-</span>
    </header>
    <div id="chat-root"></div>
    <div id="modal-root"></div>
    <nav id="mobile-nav-root" aria-label="Station navigation"></nav>

    <!-- Boot / loader screen -->
    <div id="loader" role="dialog" aria-modal="true" aria-label="Boot sequence">
      <div class="loader__inner">
        <p class="loader__tag">// STATION LINK</p>
        <h1 class="loader__title">SIGNAL LOST</h1>
        <p class="loader__sub">Recovery Engineer, the station is dark. Restore power.</p>

        <!-- Step 1: how does the visitor want to explore? -->
        <div id="mode-choice" class="mode-choice" role="group" aria-labelledby="mode-q">
          <p id="mode-q" class="mode-choice__q">// HOW WOULD YOU LIKE TO EXPLORE?</p>
          <div class="mode-choice__grid">
            <button id="mode-play" class="mode-card" type="button">
              <span class="mode-card__title">PLAY THE MISSION</span>
              <span class="mode-card__text">Restore the station, play mini-games and unlock the portfolio room by room. About 10 minutes.</span>
            </button>
            <button id="mode-quick" class="mode-card mode-card--alt" type="button">
              <span class="mode-card__title">QUICK PORTFOLIO</span>
              <span class="mode-card__text">No game. Scroll through everything in 3D. Under 2 minutes.</span>
            </button>
          </div>
        </div>

        <!-- Step 2 (game only): boot log, then enter with or without sound -->
        <div id="boot-panel" hidden>
          <div class="loader__bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span id="loader-fill"></span>
          </div>
          <ul class="loader__log" id="loader-log" aria-live="polite"></ul>
          <div class="loader__actions">
            <button id="start-btn" class="btn" type="button" disabled>INITIALIZING...</button>
          </div>
        </div>
      </div>
    </div>

    <noscript>
      <p style="position:fixed;inset:0;display:grid;place-items:center;background:#05070D;color:#FF6B2C;font-family:monospace">
        SIGNAL LOST requires JavaScript to run.
      </p>
    </noscript>

    <script type="module" src="/src/core/main.js"></script>
  </body>
</html>
